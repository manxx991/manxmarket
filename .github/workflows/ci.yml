name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: PHPUnit and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Composer's package discovery also boots Laravel before PHPUnit.
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_CONFIG_CACHE: tests/.phpunit-no-config-cache.php
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: '(null)'
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      LOG_CHANNEL: 'null'
      FILESYSTEM_DISK: local
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: '8.1'
          extensions: mbstring, dom, curl, libxml, sqlite3, pdo_sqlite, intl
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Verify tracked minified bundle is current
        run: git diff --exit-code -- public/assets/js/app.min.js

      - name: Run Laravel tests
        run: |
          APP_KEY=$(php -r 'echo "base64:", base64_encode(random_bytes(32));')
          export APP_KEY
          php artisan test --without-tty --compact
